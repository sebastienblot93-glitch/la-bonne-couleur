<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La bonne couleur — jeu de drapeaux</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e6e8ef;
    --blue:#1a5cff; --blue-d:#0f47d6; --good:#13a05f; --warn:#e08a00; --bad:#e0353b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;}
  .app{max-width:580px;margin:0 auto;padding:18px 18px 40px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
  .brand .dot{width:18px;height:18px;border-radius:6px;background:conic-gradient(#e0353b,#ffce00,#13a05f,#1a5cff,#e0353b)}
  .stats{display:flex;gap:8px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
  .pill b{color:var(--ink)}
  .card{background:var(--card);border-radius:22px;box-shadow:0 1px 2px rgba(20,30,60,.05),0 8px 30px rgba(20,30,60,.06);padding:22px 22px 26px}
  .progress{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:-4px 0 18px}
  .progress i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .4s}
  .prompt{text-align:center;color:#4b5363;font-size:16px;margin:0 0 20px;line-height:1.4}
  .prompt b{color:var(--ink);font-weight:800}
  .stage{display:flex;justify-content:center;align-items:center;min-height:236px;margin-bottom:22px}
  .flag{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 6px 22px rgba(20,30,60,.22);cursor:default;line-height:0}
  .flag svg{display:block}
  .flag canvas{position:absolute;inset:0;pointer-events:none}
  .flag.clickable{cursor:pointer}
  .flag-tag{position:absolute;left:8px;top:8px;line-height:1;background:rgba(15,20,35,.72);color:#fff;font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;letter-spacing:.3px}
  .sliders{display:grid;grid-template-columns:44px 1fr;gap:14px 12px;align-items:center}
  .sliders label{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted)}
  .track{position:relative;height:38px;border-radius:19px;cursor:pointer;touch-action:none;outline:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .track:focus-visible{box-shadow:0 0 0 3px rgba(26,92,255,.35)}
  .thumb{position:absolute;top:50%;width:32px;height:32px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
  .hue{background:linear-gradient(to right,#f00,#ff0 16.66%,#0f0 33.33%,#0ff 50%,#00f 66.66%,#f0f 83.33%,#f00)}
  .hexrow{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0 20px}
  .swatch{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .hex{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;letter-spacing:2px;color:#4b5363;
    border:1px solid transparent;background:transparent;width:104px;text-align:center;padding:4px 6px;border-radius:8px;text-transform:uppercase}
  .hex:hover{border-color:var(--line)}
  .hex:focus{outline:none;border-color:var(--blue);background:#f3f6ff}
  .btn{display:block;width:100%;border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;font-weight:800;font-size:18px;
    padding:17px;cursor:pointer;transition:background .15s,transform .05s}
  .btn:hover{background:var(--blue-d)}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue);margin-top:10px}
  .btn.ghost:hover{background:#f0f4ff}
  .hint{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}
  /* résultat */
  .result{display:none}
  .verdict{text-align:center;margin:-4px 0 16px}
  .verdict .big{font-size:26px;font-weight:900;letter-spacing:-.4px}
  .verdict .pts{font-size:15px;color:var(--muted);margin-top:2px}
  .verdict .pts b{color:var(--ink)}
  .compare{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);margin-bottom:12px}
  .compare div{height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;font-size:12px;font-weight:700}
  .compare span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;letter-spacing:1px;font-weight:600}
  .meter{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 2px 18px}
  .ok{color:var(--good)} .mid{color:var(--warn)} .ko{color:var(--bad)}
  /* fin */
  .end{display:none}
  .end h2{text-align:center;margin:0 0 4px;font-size:15px;color:var(--muted);font-weight:700}
  .total{text-align:center;font-size:54px;font-weight:900;letter-spacing:-1px;line-height:1.05}
  .total small{font-size:20px;color:var(--muted);font-weight:700}
  .best{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 18px}
  .rows{border-top:1px solid var(--line);margin-bottom:20px}
  .row{display:grid;grid-template-columns:56px 1fr 46px 46px 48px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row .mini{line-height:0;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.25);width:fit-content}
  .row .sw{height:24px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .row .p{text-align:right;font-weight:800}
  .row .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legend{display:grid;grid-template-columns:56px 1fr 46px 46px 48px;gap:10px;font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--muted);padding-bottom:6px}
  @media (max-width:420px){
    .app{padding:12px 10px 30px}.card{padding:18px 14px 22px}
    .sliders{grid-template-columns:50px 1fr;gap:12px 8px}.sliders label{font-size:10px;letter-spacing:.6px}
    .brand{font-size:15px}.brand span:last-child{display:none}.pill{padding:5px 10px;font-size:12px}
    .stage{min-height:190px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="dot"></span><span>La bonne couleur</span></div>
    <div class="stats">
      <div class="pill">Manche <b id="roundTxt">1</b>/<span id="roundsTxt">10</span></div>
      <div class="pill">Score <b id="scoreTxt">0</b></div>
    </div>
  </div>

  <div class="card">
    <div class="progress"><i id="prog" style="width:0"></i></div>

    <!-- Jeu -->
    <div id="play">
      <p class="prompt" id="prompt"></p>
      <div class="stage"><div class="flag" id="flag"></div></div>

      <div id="guess">
        <div class="sliders">
          <label>TEINTE</label><div class="track hue" id="sH" tabindex="0" role="slider" aria-label="Teinte"><div class="thumb"></div></div>
          <label>SAT</label><div class="track" id="sS" tabindex="0" role="slider" aria-label="Saturation"><div class="thumb"></div></div>
          <label>LUM</label><div class="track" id="sV" tabindex="0" role="slider" aria-label="Luminosité"><div class="thumb"></div></div>
        </div>
        <div class="hexrow">
          <div class="swatch" id="sw"></div>
          <input class="hex" id="hex" maxlength="7" spellcheck="false" aria-label="Code hexadécimal">
        </div>
        <button class="btn" id="submit">Valider</button>
        <div class="hint">Astuce : flèches du clavier pour affiner (Maj = pas plus grand), Entrée pour valider.</div>
      </div>

      <div class="result" id="result">
        <div class="verdict"><div class="big" id="vBig"></div><div class="pts" id="vPts"></div></div>
        <div class="compare">
          <div id="cYou">Ta couleur<span></span></div>
          <div id="cTrue">Vraie couleur<span></span></div>
        </div>
        <div class="meter"><span id="mDe"></span><span>Clique sur le drapeau pour comparer</span></div>
        <button class="btn" id="next">Manche suivante</button>
      </div>
    </div>

    <!-- Fin -->
    <div class="end" id="end">
      <h2>Score final</h2>
      <div class="total"><span id="tot">0</span><small> / <span id="totMax">1000</span></small></div>
      <div class="best" id="best"></div>
      <div class="legend"><span></span><span>PAYS</span><span>TOI</span><span>VRAI</span><span style="text-align:right">PTS</span></div>
      <div class="rows" id="rows"></div>
      <button class="btn" id="again">Rejouer</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const ROUNDS = 10;

/* ---------- Constructeur de dessins SVG ---------- */
let UID = 0;
const n4 = v => +(+v).toFixed(4);
function B(f, W, H) {
  const st = i => `style="fill:${f(i)}"`;
  const eps = 0.004 * Math.max(W, H);
  const g = {
    r: (x, y, w, h, i) => `<rect x="${n4(x)}" y="${n4(y)}" width="${n4(w)}" height="${n4(h)}" ${st(i)}/>`,
    bg: i => g.r(0, 0, W, H, i),
    h: (ix, wt) => { wt = wt || ix.map(() => 1); const s = wt.reduce((a, b) => a + b, 0); let y = 0, o = '';
      ix.forEach((i, k) => { const hh = wt[k] / s * H; o += g.r(0, y, W, hh + (k < ix.length - 1 ? eps : 0), i); y += hh; }); return o; },
    v: (ix, wt) => { wt = wt || ix.map(() => 1); const s = wt.reduce((a, b) => a + b, 0); let x = 0, o = '';
      ix.forEach((i, k) => { const ww = wt[k] / s * W; o += g.r(x, 0, ww + (k < ix.length - 1 ? eps : 0), H, i); x += ww; }); return o; },
    p: (pts, i) => `<polygon points="${pts.map(n4).join(' ')}" ${st(i)}/>`,
    c: (cx, cy, r, i) => `<circle cx="${n4(cx)}" cy="${n4(cy)}" r="${n4(r)}" ${st(i)}/>`,
    s: (cx, cy, R, i, rot = 0, n = 5, k = 0.381966) => { const pts = [];
      for (let j = 0; j < 2 * n; j++) { const a = (-90 + rot + j * 180 / n) * Math.PI / 180, rr = j % 2 ? R * k : R;
        pts.push(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); } return g.p(pts, i); },
    l: (x1, y1, x2, y2, w, i) => { const dx = x2 - x1, dy = y2 - y1;
      return `<line x1="${n4(x1 - dx * .3)}" y1="${n4(y1 - dy * .3)}" x2="${n4(x2 + dx * .3)}" y2="${n4(y2 + dy * .3)}" style="stroke:${f(i)};stroke-width:${w}"/>`; },
    cr: (cx, cy, r, cx2, cy2, r2, i) => { const id = 'mk' + (++UID);
      return `<mask id="${id}" maskUnits="userSpaceOnUse" x="-1000" y="-1000" width="3000" height="3000"><rect x="-1000" y="-1000" width="3000" height="3000" fill="#fff"/><circle cx="${n4(cx2)}" cy="${n4(cy2)}" r="${n4(r2)}" fill="#000"/></mask><circle cx="${n4(cx)}" cy="${n4(cy)}" r="${n4(r)}" mask="url(#${id})" ${st(i)}/>`; },
    ring: (cx, cy, r, w, i) => `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:none;stroke:${f(i)};stroke-width:${w}"/>`,
    path: (d, i) => `<path d="${d}" ${st(i)}/>`,
    pentagram: (cx, cy, R, w, i) => { const P = [];
      for (let j = 0; j < 5; j++) { const a = (-90 + j * 72) * Math.PI / 180; P.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
      const o = [0, 2, 4, 1, 3].map(j => P[j].map(n4).join(','));
      return `<path d="M${o.join(' L')} Z" style="fill:none;stroke:${f(i)};stroke-width:${w};stroke-linejoin:miter;stroke-miterlimit:10"/>`; },
    zig: (x0, x1, n, i) => { const pts = [0, 0, x0, 0];
      for (let k = 0; k < n; k++) pts.push(x1, (k + .5) * H / n, x0, (k + 1) * H / n);
      pts.push(0, H); return g.p(pts, i); },
  };
  return g;
}

/* ---------- Couleurs ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function hsv2rgb(h, s, v) { const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [f(5), f(3), f(1)].map(x => Math.round(x * 255)); }

  let h = 0; if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
  return [h, mx ? d / mx : 0, mx]; }
const toHex = rgb => '#' + rgb.map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
const fromHex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function lab(hex) {
  const [r, g, b] = fromHex(hex).map(v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  const X = (r * .4124 + g * .3576 + b * .1805) / .95047, Y = r * .2126 + g * .7152 + b * .0722, Z = (r * .0193 + g * .1192 + b * .9505) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
}
function dE(h1, h2) { // CIEDE2000
  const [L1, a1, b1] = lab(h1), [L2, a2, b2] = lab(h2), rad = Math.PI / 180, deg = 180 / Math.PI;
  const Cb = (Math.hypot(a1, b1) + Math.hypot(a2, b2)) / 2, G = .5 * (1 - Math.sqrt(Cb ** 7 / (Cb ** 7 + 25 ** 7)));
  const a1p = a1 * (1 + G), a2p = a2 * (1 + G), C1 = Math.hypot(a1p, b1), C2 = Math.hypot(a2p, b2);
  const hh = (a, b) => { if (!a && !b) return 0; const x = Math.atan2(b, a) * deg; return x < 0 ? x + 360 : x; };
  const hp1 = hh(a1p, b1), hp2 = hh(a2p, b2), dL = L2 - L1, dC = C2 - C1;
  let dh = 0; if (C1 * C2) { dh = hp2 - hp1; if (dh > 180) dh -= 360; else if (dh < -180) dh += 360; }
  const dH = 2 * Math.sqrt(C1 * C2) * Math.sin(dh * rad / 2), Lb = (L1 + L2) / 2, Cbp = (C1 + C2) / 2;
  let hb = hp1 + hp2; if (C1 * C2) hb = Math.abs(hp1 - hp2) > 180 ? (hp1 + hp2 < 360 ? (hp1 + hp2 + 360) / 2 : (hp1 + hp2 - 360) / 2) : (hp1 + hp2) / 2;
  const T = 1 - .17 * Math.cos((hb - 30) * rad) + .24 * Math.cos(2 * hb * rad) + .32 * Math.cos((3 * hb + 6) * rad) - .2 * Math.cos((4 * hb - 63) * rad);

  return Math.sqrt((dL / Sl) ** 2 + (dC / Sc) ** 2 + (dH / Sh) ** 2 + Rt * (dC / Sc) * (dH / Sh));
}
const points = d => Math.round(100 / (1 + Math.pow(d / 10, 2)));
function verdict(d) {

  if (d < 20) return ['Pas mal', 'mid']; if (d < 35) return ['Bof…', 'mid']; return ['Raté !', 'ko'];
}

/* ---------- Rendu ---------- */
function flagSVG(flag, f, w, h) {
  const g = B(f, flag.W, flag.H); g._f = f;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${flag.W} ${flag.H}" width="${w}" height="${h}" preserveAspectRatio="none">${flag.d(g)}</svg>`;
}
const colorsWith = (flag, t, hex) => i => (i === t ? hex : flag.c[i]);
function fitSize(flag, maxW, maxH) { const r = flag.W / flag.H; let w = maxW, h = maxW / r; if (h > maxH) { h = maxH; w = maxH * r; } return [Math.round(w), Math.round(h)]; }

/* ---------- Fourmis (contour pointillé animé) ---------- */
let ants = null, antsTimer = 0;
function stopAnts() { clearInterval(antsTimer); antsTimer = 0; ants = null; }
function startAnts(flagEl, flag, t, w, h) {
  stopAnts();
  const dpr = Math.min(2, window.devicePixelRatio || 1), pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  const svg = flagSVG(flag, i => (i === t ? '#fff' : '#000'), pw, ph);
  const img = new Image(), token = {};
  ants = token;
  img.onload = () => {
    if (ants !== token) return;
    const off = document.createElement('canvas'); off.width = pw; off.height = ph;
    const ox = off.getContext('2d'); ox.fillStyle = '#000'; ox.fillRect(0, 0, pw, ph); ox.drawImage(img, 0, 0, pw, ph);
    const d = ox.getImageData(0, 0, pw, ph).data, N = pw * ph, m = new Uint8Array(N);
    for (let p = 0; p < N; p++) m[p] = d[p * 4] > 127 ? 1 : 0;
    // distance (en px) au bord, limitée à « th »
    const th = Math.max(2, Math.round(2 * dpr)); let edge = new Uint8Array(N);
    for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++) { const p = y * pw + x; if (!m[p]) continue;
      if (x === 0 || y === 0 || x === pw - 1 || y === ph - 1 || !m[p - 1] || !m[p + 1] || !m[p - pw] || !m[p + pw]) edge[p] = 1; }
    for (let k = 1; k < th; k++) { const nx = edge.slice();
      for (let y = 1; y < ph - 1; y++) for (let x = 1; x < pw - 1; x++) { const p = y * pw + x;
        if (m[p] && !edge[p] && (edge[p - 1] || edge[p + 1] || edge[p - pw] || edge[p + pw])) nx[p] = 1; }
      edge = nx; }
    const idx = []; for (let p = 0; p < N; p++) if (edge[p]) idx.push(p);
    const cv = document.createElement('canvas'); cv.width = pw; cv.height = ph; cv.style.width = w + 'px'; cv.style.height = h + 'px';
    flagEl.appendChild(cv);
    const cx = cv.getContext('2d'), out = cx.createImageData(pw, ph), u32 = new Uint32Array(out.data.buffer);
    const BLACK = 0xff1a1a1a, WHITE = 0xffffffff, dash = Math.round(4 * dpr);
    let off2 = 0;
    const draw = () => { for (const p of idx) { const x = p % pw, y = (p / pw) | 0; u32[p] = ((Math.floor((x + off2) / dash) + Math.floor((y + off2) / dash)) & 1) ? BLACK : WHITE; }
      cx.putImageData(out, 0, 0); off2 = (off2 + Math.max(1, Math.round(dpr))) % (dash * 2); };
    draw(); antsTimer = setInterval(() => { if (ants !== token) return; draw(); }, 70);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- Curseurs ---------- */
function slider(el, get, set) {
  const thumb = el.querySelector('.thumb');
  const pos = () => { const v = get(); thumb.style.left = `calc(19px + ${v} * (100% - 38px))`; el.setAttribute('aria-valuenow', Math.round(v * 100)); };
  const fromX = x => { const r = el.getBoundingClientRect(); set(clamp((x - r.left - 19) / (r.width - 38), 0, 1)); };
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); el.focus(); fromX(e.clientX); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) fromX(e.clientX); });
  el.addEventListener('keydown', e => { const st = e.shiftKey ? .05 : .005;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { set(clamp(get() + st, 0, 1)); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { set(clamp(get() - st, 0, 1)); e.preventDefault(); } });
  return pos;
}

/* ---------- État du jeu ---------- */
const $ = id => document.getElementById(id);
const S = { deck: [], round: 0, total: 0, results: [], flag: null, t: 0, truth: '', h: 0, s: 0, v: 0, phase: 'guess', size: [0, 0], showMine: false };
const cur = () => toHex(hsv2rgb(S.h, S.s, S.v));

const posH = slider($('sH'), () => S.h / 360, x => { S.h = x * 360; update(); });
const posS = slider($('sS'), () => S.s, x => { S.s = x; update(); });
const posV = slider($('sV'), () => S.v, x => { S.v = x; update(); });

function update(skipHex) {
  const hex = cur();
  $('sS').style.background = `linear-gradient(to right, ${toHex(hsv2rgb(S.h, 0, S.v))}, ${toHex(hsv2rgb(S.h, 1, S.v))})`;
  $('sV').style.background = `linear-gradient(to right, #000, ${toHex(hsv2rgb(S.h, S.s, 1))})`;
  posH(); posS(); posV();
  $('sw').style.background = hex;
  if (!skipHex) $('hex').value = hex;
  const svg = $('flag').querySelector('svg'); if (svg && S.phase === 'guess') svg.style.setProperty('--c' + S.t, hex);
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function newGame() {
  S.deck = shuffle(FLAGS.slice()).slice(0, ROUNDS); S.round = 0; S.total = 0; S.results = [];
  $('end').style.display = 'none'; $('play').style.display = 'block';
  $('roundsTxt').textContent = ROUNDS;
  startRound();
}

function wrongColor(flag, t) {
  const truth = flag.c[t];
  for (let k = 0; k < 400; k++) {
    const h = Math.random() * 360, s = .2 + Math.random() * .8, v = .25 + Math.random() * .75, hex = toHex(hsv2rgb(h, s, v));
    if (dE(hex, truth) < 28) continue;
    if (flag.c.some((c, i) => i !== t && dE(hex, c) < 14)) continue;
    return [h, s, v];
  }
  return rgb2hsv(fromHex('#808080'));
}

function renderFlag() {
  const el = $('flag'), stage = el.parentElement;
  const maxW = Math.min(340, stage.clientWidth - 8), maxH = window.innerWidth < 420 ? 190 : 230;
  const [w, h] = fitSize(S.flag, maxW, maxH); S.size = [w, h];
  let f;
  if (S.phase === 'guess') f = i => `var(--c${i})`;
  else f = S.showMine ? colorsWith(S.flag, S.t, S.guess) : (i => S.flag.c[i]);
  el.innerHTML = flagSVG(S.flag, f, w, h);
  if (S.phase === 'guess') {
    const svg = el.querySelector('svg'); S.flag.c.forEach((c, i) => svg.style.setProperty('--c' + i, i === S.t ? cur() : c));
    startAnts(el, S.flag, S.t, w, h);
  } else {
    stopAnts();
    el.insertAdjacentHTML('beforeend', `<span class="flag-tag">${S.showMine ? 'Ta version' : 'Vrai drapeau'}</span>`);
  }
}

function startRound() {
  const flag = S.deck[S.round]; S.flag = flag; S.phase = 'guess'; S.showMine = false;
  const cand = flag.c.map((_, i) => i).filter(i => !(flag.minor || []).includes(i));
  S.t = cand[Math.floor(Math.random() * cand.length)]; S.truth = flag.c[S.t];
  [S.h, S.s, S.v] = wrongColor(flag, S.t);
  const de = flag.de.endsWith("'") ? flag.de : flag.de + ' ';
  $('prompt').innerHTML = `Une couleur est fausse dans le drapeau ${de}<b>${flag.n}</b> — corrige-la`;
  $('roundTxt').textContent = S.round + 1; $('scoreTxt').textContent = S.total;
  $('prog').style.width = (S.round / ROUNDS * 100) + '%';
  $('guess').style.display = 'block'; $('result').style.display = 'none';
  $('flag').classList.remove('clickable');
  renderFlag(); update();
}

function submit() {
  if (S.phase !== 'guess') return;
  S.guess = cur(); const d = dE(S.guess, S.truth), pts = points(d);
  S.total += pts; S.results.push({ flag: S.flag, t: S.t, guess: S.guess, truth: S.truth, d, pts });
  S.phase = 'result';
  const [txt, cls] = verdict(d);
  $('vBig').textContent = txt; $('vBig').className = 'big ' + cls;
  $('vPts').innerHTML = `+<b>${pts}</b> point${pts > 1 ? 's' : ''}`;
  const lum = hex => lab(hex)[0] > 60 ? '#1d2433' : '#fff';
  $('cYou').style.background = S.guess; $('cYou').style.color = lum(S.guess); $('cYou').querySelector('span').textContent = S.guess;
  $('cTrue').style.background = S.truth; $('cTrue').style.color = lum(S.truth); $('cTrue').querySelector('span').textContent = S.truth;
  $('mDe').textContent = `Écart ΔE₀₀ : ${d.toFixed(1)}`;
  $('scoreTxt').textContent = S.total; $('prog').style.width = ((S.round + 1) / ROUNDS * 100) + '%';
  $('next').textContent = S.round + 1 >= ROUNDS ? 'Voir le score final' : 'Manche suivante';
  $('guess').style.display = 'none'; $('result').style.display = 'block';
  $('flag').classList.add('clickable');
  renderFlag(); $('next').focus();
}

function next() { S.round++; if (S.round >= ROUNDS) finish(); else startRound(); }

function finish() {
  stopAnts(); $('play').style.display = 'none'; $('end').style.display = 'block';
  $('tot').textContent = S.total; $('totMax').textContent = ROUNDS * 100;
  let best = null; try { best = +localStorage.getItem('bonneCouleurBest') || null; if (!best || S.total > best) localStorage.setItem('bonneCouleurBest', S.total); } catch (e) {}
  $('best').textContent = best == null ? 'Premier record établi !' : (S.total > best ? `Nouveau record ! (ancien : ${best})` : `Record : ${best}`);
  $('rows').innerHTML = S.results.map(r => {
    const [w, h] = fitSize(r.flag, 48, 30);
    return `<div class="row"><div class="mini">${flagSVG(r.flag, i => r.flag.c[i], w, h)}</div><div class="name">${r.flag.n}</div>
      <div class="sw" style="background:${r.guess}" title="${r.guess}"></div><div class="sw" style="background:${r.truth}" title="${r.truth}"></div>
      <div class="p ${verdict(r.d)[1]}">${r.pts}</div></div>`;
  }).join('');
}

/* ---------- Événements ---------- */
$('submit').addEventListener('click', submit);
$('next').addEventListener('click', next);
$('again').addEventListener('click', newGame);
$('flag').addEventListener('click', () => { if (S.phase === 'result') { S.showMine = !S.showMine; renderFlag(); } });
$('hex').addEventListener('input', e => {
  let v = e.target.value.trim(); if (!v.startsWith('#')) v = '#' + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) { const [h, s, b] = rgb2hsv(fromHex(v)); if (s > 0 && b > 0) S.h = h; if (b > 0) S.s = s; S.v = b; update(true); }
});
$('hex').addEventListener('blur', () => update());
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (S.phase === 'guess' && $('play').style.display !== 'none') { e.preventDefault(); submit(); }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if ($('play').style.display !== 'none') renderFlag(); }, 150); });

newGame();
})();
</script>
</body>
