services:
  # Le jeu (site + API + duels), hébergé en Europe
  - type: web
    runtime: node
    name: la-bonne-couleur
    region: frankfurt
    plan: free
    # Aucune dépendance npm : rien à installer
    buildCommand: echo "Aucun build necessaire"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secret qui signe les parties (anti-triche), généré par Render
      - key: GAME_SECRET
        generateValue: true
      # Base du classement : adresse Upstash (rediss://default:MOT_DE_PASSE@xxx.upstash.io:6379)
      # À saisir dans le tableau de bord Render (onglet Environment), jamais dans ce fichier.
      - key: REDIS_URL
        sync: false
